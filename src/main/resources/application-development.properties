# ---------------------------------------------
# General Configuration
# ---------------------------------------------
server.port=${SERVICE_PORT}
# Eureka Configurations
spring.cloud.refresh.enabled=false
# Spring Cloud Kubernetes
spring.cloud.kubernetes.discovery.enabled=${KUBERNETES_DISCOVERY_ENABLED:false}
# ----------------------------------------------------------------------------
# JPA and Hibernate settings
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.show-sql=${ENABLE_HIBERNATE_SQL:false}
spring.jpa.properties.hibernate.format_sql=${ENABLE_HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.OracleLegacyDialect
#spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
# ---------------------------------------------
# Logging (so o que difere da base)
# ---------------------------------------------
# Flyway debug: emit executed SQL statements
logging.level.org.flywaydb=TRACE
logging.level.org.flywaydb.core=TRACE
logging.level.org.flywaydb.core.internal=TRACE
logging.level.org.flywaydb.core.internal.sqlscript=TRACE

# Authentication
# Em dev a seguranca fica desligada salvo SECURITY_ENABLED=true; definir IGRP_ACCESS_API_BASE_URL
# quando se quiser validar tokens localmente.
app.security.enabled=${SECURITY_ENABLED:false}
