# Spring Cloud Kubernetes
spring.cloud.kubernetes.discovery.enabled=${KUBERNETES_DISCOVERY_ENABLED:true}

# Authentication
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IGRP_ACCESS_API_BASE_URL}

# Swagger
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}

# Thymeleaf (templates de documentos)
spring.thymeleaf.cache=true
