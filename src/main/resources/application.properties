# ---------------------------------------------
# General Configuration
# ---------------------------------------------
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false
spring.application.name=${SERVICE_NAME:inps-rh-api}
spring.profiles.active=${SPRING_ACTIVE_PROFILE:development}
server.shutdown=graceful
spring.threads.virtual.enabled=true
management.endpoint.health.probes.enabled=true
# Properties to control the automatic rest endpoint creation for enum values
igrp.enum.exposer.enabled=${IGRP_ENUM_EXPOSER_ENABLED:true}
igrp.enum.exposer.path=${IGRP_ENUM_EXPOSER_PATH:api/v1/enums}
# --------------------------------------------------------
# IGRP ACCESS BASE URL
# --------------------------------------------------------
# O Acesso e tambem o emissor dos tokens (issuer-uri, em #Authentication).
igrp.access.api.base-url=${IGRP_ACCESS_API_BASE_URL:}
# --------------------------------------------------------
# IGRP M2M (Machine-to-Machine) Configuration
# --------------------------------------------------------
igrp.m2m.service-name=${spring.application.name}
# Credenciais client_credentials usadas nas chamadas M2M ao Acesso: o AuthorizationSyncRunner
# (activado pelo IgrpAuthConfig) regista-as no ApiClient no arranque. Sem elas o framework cai no
# modo de token estatico deprecated. Falha do sync so da log, nao impede o arranque.
igrp.access.m2m.client-id=${IGRP_ACCESS_M2M_CLIENT_ID:}
igrp.access.m2m.client-secret=${IGRP_ACCESS_M2M_CLIENT_SECRET:}
igrp.access.m2m.scope=${IGRP_ACCESS_M2M_SCOPE:}
# --------------------------------------------------------
# Datasource
# --------------------------------------------------------
# Comum a todos os ambientes; um profile que precise de outra ligacao sobrepoe estas chaves.
# Exemplo usando SID
# spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST}:${ORACLE_PORT}:${ORACLE_SID}
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST}:${ORACLE_PORT}/${ORACLE_SERVICE_NAME}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# ----------------------------------------------------------------------------
# JPA and Hibernate settings
# (ddl-auto e show-sql por ambiente nos application-<profile>.properties)
# ----------------------------------------------------------------------------
# BD de dev e Oracle 11g: o OracleDialect do core exige 19+ (e identity); o legacy cobre as versoes antigas
# e detecta a versao real no arranque.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batch fetching de associacoes lazy (colapsa N lookups por PK num unico IN)
spring.jpa.properties.hibernate.default_batch_fetch_size=25
# ---------------------------------------------
# Logging (common defaults)
# ---------------------------------------------
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}
logging.level.cv.inps.rh=${LOGGING_LEVEL_APP:INFO}
# ---------------------------------------------
# Swagger Documentation
# ---------------------------------------------
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.docExpansion=none
# ---------------------------------------------
# File Storage (MinIO S3)
# ---------------------------------------------
igrp.storage-provider=minio
igrp.minio.endpoint=${STORAGE_ENDPOINT}
igrp.minio.port=${STORAGE_PORT}
igrp.minio.security=${STORAGE_SECURITY}
igrp.minio.access-key=${STORAGE_ACCESS_KEY}
igrp.minio.secret-key=${STORAGE_SECRET_KEY}
igrp.minio.bucket-name=${STORAGE_BUCKET_NAME}
igrp.minio.url-expiration-time=${STORAGE_PRESIGNED_URL_EXPIRATION_TIME}
igrp.minio.region=${STORAGE_REGION}
logging.level.io.minio=DEBUG
logging.level.cv.igrp.platform.filemanager=DEBUG
# --------------------------------------------------------
# Processamento salarial
# --------------------------------------------------------
processamento-salarial.base.url=${PROCESSAMENTO_SALARIAL_BASE_URL}
# --------------------------------------------------------
# Servicos externos (NIF, SNIAC, BI, Segurado)
# --------------------------------------------------------
external.nif.url=${EXTERNAL_NIF_URL:http://localhost:8080}
external.nif.token=${EXTERNAL_NIF_TOKEN:dev-token}
external.sniac.url=${EXTERNAL_SNIAC_URL:http://localhost:8080}
external.sniac.token=${EXTERNAL_SNIAC_TOKEN:dev-token}
external.bi.url=${EXTERNAL_BI_URL:http://localhost:8080}
external.bi.token=${EXTERNAL_BI_TOKEN:dev-token}
external.segurado.url=${EXTERNAL_SEGURADO_URL:https://3sb.inps.cv/portal_unico/v1.0.0/get_segurado_api}
external.segurado.token=${EXTERNAL_SEGURADO_URL:1451d0f2-d73d-3514-a4fc-1eb11706ebd8}
# ---------------------------------------------
# Email (notificacoes)
# ---------------------------------------------
notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ---------------------------------------------
# Thymeleaf (templates de documentos)
# ---------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# ---------------------------------------------
# Multipart upload
# ---------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# ---------------------------------------------
# Flyway
# ---------------------------------------------
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

#Authentication
# Issuer vazio => decoder desligado. SECURITY_ENABLED=false so e honrado no profile development.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IGRP_ACCESS_API_BASE_URL:}
app.security.enabled=${SECURITY_ENABLED:true}
# @PreAuthorize nos controllers (hoje nenhum endpoint tem). METHOD_SECURITY_ENABLED=false desliga.
igrp.framework.auth.method-security.enabled=${METHOD_SECURITY_ENABLED:true}

# ---------------------------------------------
# Perfil IAM
# ---------------------------------------------
# Intervalo minimo entre sincronizacoes do perfil IAM (t_iam_user_profile) do mesmo utilizador a
# partir do JWT. O sync corre em todos os pedidos autenticados; sem este tecto seria uma transacao
# de escrita por request.
iam.profile.sync.ttl-minutes=${IAM_PROFILE_SYNC_TTL_MINUTES:30}
